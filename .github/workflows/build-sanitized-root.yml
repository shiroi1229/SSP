name: Build Sanitized Root

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-clean-root:
    if: github.event.issue.title == '[security] build sanitized root'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current safe main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Create history-free root commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-sanitizer"
          git config user.email "security-sanitizer@users.noreply.github.com"
          rm -f .github/workflows/build-sanitized-root.yml
          git switch --orphan sanitized-root
          git add -A
          git commit -m "security: sanitized root"
          git push --force origin HEAD:refs/heads/security/sanitized-root-candidate
