name: Build Sanitized Root V2

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-clean-root:
    if: github.event.issue.title == '[security] build sanitized root v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current safe main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Create parentless commit from safe main tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-sanitizer"
          git config user.email "security-sanitizer@users.noreply.github.com"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          ROOT_SHA="$(printf '%s\n' 'security: sanitized parentless root' | git commit-tree "$TREE_SHA")"
          git push --force origin "$ROOT_SHA:refs/heads/security/sanitized-root-candidate"
