name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compile security-critical Python files
        run: |
          python3 -m py_compile \
            modules/config_manager.py \
            modules/rag_engine.py \
            backend/dev_recorder.py \
            backend/scripts/add_parent_id_column.py \
            scripts/secret_scan.py \
            scripts/rotate_postgres_password.py \
            scripts/purge_sensitive_history.py

      - name: Scan tracked files for credentials
        run: python3 scripts/secret_scan.py

  root-sanitizer:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == '[security] build sanitized root v3'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out safe base main only
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Create parentless commit from safe main tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-sanitizer"
          git config user.email "security-sanitizer@users.noreply.github.com"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          ROOT_SHA="$(printf '%s\n' 'security: sanitized parentless root v3' | git commit-tree "$TREE_SHA")"
          git push --force origin "$ROOT_SHA:refs/heads/security/sanitized-root-candidate"
