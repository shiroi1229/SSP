name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compile security-critical Python files
        run: |
          python3 -m py_compile \
            modules/config_manager.py \
            modules/rag_engine.py \
            backend/dev_recorder.py \
            backend/scripts/add_parent_id_column.py \
            scripts/secret_scan.py \
            scripts/rotate_postgres_password.py \
            scripts/purge_sensitive_history.py

      - name: Scan tracked files for credentials
        run: python3 scripts/secret_scan.py

  support-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == '[security] collect purge evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean main with credentials
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch read-only pull request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/pull/*/head:refs/pull/*/head' '+refs/pull/*/merge:refs/pull/*/merge'

      - name: Build private replacement patterns
        shell: bash
        run: |
          set -euo pipefail
          git show 550a05994cf521d749b155163e28d2054e519cad:.env > "$RUNNER_TEMP/historical.env"
          python3 - <<'PY'
          import os, re, stat
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          text = (temp / 'historical.env').read_text(encoding='utf-8-sig')
          match = re.search(r'(?m)^POSTGRES_PASSWORD=(.+)$', text)
          if not match:
              raise SystemExit('historical credential not found')
          secret = match.group(1).strip()
          if not secret or '\n' in secret or '\r' in secret or '==>' in secret:
              raise SystemExit('unsupported historical credential format')
          replace = temp / 'replace-text.txt'
          verify = temp / 'verify-secret.txt'
          replace.write_text(f'literal:{secret}==><REDACTED>\n', encoding='utf-8')
          verify.write_text(secret + '\n', encoding='utf-8')
          os.chmod(replace, stat.S_IRUSR | stat.S_IWUSR)
          os.chmod(verify, stat.S_IRUSR | stat.S_IWUSR)
          (temp / 'historical.env').unlink()
          PY

      - name: Rewrite disposable clone and collect official metadata
        shell: bash
        run: |
          set -euo pipefail
          git filter-repo \
            --sensitive-data-removal \
            --force \
            --invert-paths \
            --path .env \
            --path config_snapshot.json \
            --path logs/ \
            --path devlogs/ \
            --replace-text "$RUNNER_TEMP/replace-text.txt" \
            | tee "$RUNNER_TEMP/filter-repo-output.txt"

          mkdir -p "$RUNNER_TEMP/evidence"
          FILTER_DIR=".git/filter-repo"
          cp "$FILTER_DIR/changed-refs" "$RUNNER_TEMP/evidence/changed-refs.txt"
          cp "$FILTER_DIR/first-changed-commits" "$RUNNER_TEMP/evidence/first-changed-commits.txt"
          if [ -s "$FILTER_DIR/orphaned_lfs_objects" ]; then
            cp "$FILTER_DIR/orphaned_lfs_objects" "$RUNNER_TEMP/evidence/orphaned-lfs-objects.txt"
          fi
          cp "$RUNNER_TEMP/filter-repo-output.txt" "$RUNNER_TEMP/evidence/filter-repo-output.txt"

          python3 - <<'PY'
          import re, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          refs = (evidence / 'changed-refs.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          prs = sorted({int(m.group(1)) for r in refs if (m := re.fullmatch(r'refs/pull/(\d+)/head', r.strip()))})
          summary = [
              'Repository: shiroi1229/SSP',
              f'Affected pull request head refs: {len(prs)}',
              'Affected PRs: ' + (', '.join(f'#{n}' for n in prs) if prs else 'none'),
              'Current regular branch history was already moved to a parentless sanitized root before this evidence run.',
              'No credential value is included in this artifact.',
          ]
          (evidence / 'support-summary.txt').write_text('\n'.join(summary) + '\n', encoding='utf-8')
          PY

      - name: Verify historical credential absent after rewrite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if git grep -q -F -f "$RUNNER_TEMP/verify-secret.txt" "$ref" -- . 2>/dev/null; then
              echo "Credential remains in rewritten ref: $ref" >&2
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname)')
          rm -f "$RUNNER_TEMP/replace-text.txt" "$RUNNER_TEMP/verify-secret.txt"

      - name: Upload support evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-purge-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
